<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <center>
        <h1>
            hotel room booking form</h1>
        <fieldset>
            <form>
                <label for="name"> full name</label>
                <input type="text" name="name" id="name" placeholder="enter your full name">
                <br></br>
                <label for="email"> email</label>
                <input type="email" name="email" id="email" placeholder="enter your email">
                <br></br>
                <label for="phone"> phone number </label>
                <input type="tel" name="phone" id="phone" placeholder="enter your phone number">
                <br></br>
                <label for="date"> check in date </label>
                <input type="date" name="date" id="date">

                <br></br>

                <label for="date"> check out date </label>
                <input type="date" name="date" id="date">
                <br></br>
                <label for="room">room type</label>
                <select name="room" id="room">
                    <option value="single"> single room</option>
                    <option value="double"> double room</option>
                    <option value="Grand Room">Grand Room</option>
                </select>
                <br></br>
                <label for="guests"> number of guests</label>
                <input type="number" name="guest" id="guest">
                <br></br>
                <label for="request"> special requests</label>
                <br></br>
                <textarea name="request" rows="4" cols="35"></textarea>
                <br></br>
                <input type="submit" value="submit">
                <input type="reset" value="reset">
        </fieldset>
    </center>
    </form>

</body>

</html>
